<script>
window.onerror=m=>{const a=document.getElementById('app');if(a)a.insertAdjacentHTML('afterbegin','<div class="card" style="color:#d33">Error: '+String(m).replace(/</g,'&lt;')+'</div>')};
const DEFAULT_CFG={apiKey:"AIzaSyCtnuikXk-GEF7LlJxX66wPhZe33GVGy6k",authDomain:"dmcourse-a5f3a.firebaseapp.com",projectId:"dmcourse-a5f3a",storageBucket:"dmcourse-a5f3a.firebasestorage.app",messagingSenderId:"815510811352",appId:"1:815510811352:web:f188c475216773da735dad",measurementId:"G-SX75V2RMPN"};
let firebaseConfig=DEFAULT_CFG;try{const c=JSON.parse(localStorage.getItem('lms_fb')||'null');if(c&&c.projectId)firebaseConfig=c}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let db,auth,S={user:null,mats:[],exams:[],subs:[],users:[],tab:'ebooks',syl:[],prog:[],pstu:null,editStu:null,pf:'all',mat:null,draft:null,taking:null,open:null,msg:''},subbed=false;S.mode='login';
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
async function init(){
 S.keys={};S.sent=[];S.results=[];
 if(typeof firebase==='undefined'||!firebase.auth){$('#app').innerHTML='<div class="card login" style="color:#d33">Firebase library failed to load. Check your internet connection and refresh.</div>';return}
 if(firebaseConfig){try{await connect(firebaseConfig);const u=await new Promise(r=>{const un=auth.onAuthStateChanged(x=>{un();r(x)})});if(u)await loadProfile(u.uid)}catch(e){console.error(e)}}
 render()}
async function connect(c){await Promise.all(firebase.apps.map(a=>a.delete()));firebase.initializeApp(c);db=firebase.firestore();auth=firebase.auth()}
async function loadProfile(uid){const d=await db.doc('users/'+uid).get();if(!d.exists){await auth.signOut();return}const x=d.data();enter({id:uid,role:x.role,name:x.name,username:x.username,phone:x.phone,email:x.email,batch:x.batch,joined:x.joined,notes:x.notes})}
const DOM='@users.explorelms.app';
const AERR={'auth/email-already-in-use':'Username already taken','auth/invalid-credential':'Invalid username or password','auth/wrong-password':'Invalid username or password','auth/user-not-found':'Invalid username or password','auth/invalid-login-credentials':'Invalid username or password','auth/weak-password':'Password must be at least 6 characters','auth/operation-not-allowed':'Enable Email/Password sign-in in Firebase → Authentication → Sign-in method','auth/too-many-requests':'Too many attempts. Try again later.'};
const aerr=e=>AERR[e.code]||('Failed: '+(e.code||'')+' '+(e.message||e));
async function saveCfg(){const c={};CK.forEach(k=>c[k]=$('#c_'+k).value.trim());
 if(!c.apiKey||!c.projectId||!c.appId)return $('#cm').textContent='apiKey, projectId and appId are required';
 if(!c.authDomain)c.authDomain=c.projectId+'.firebaseapp.com';$('#cm').textContent='Connecting…';
 try{await connect(c);try{await auth.signInWithEmailAndPassword('check'+DOM,'check-password')}catch(e){if(/configuration-not-found|operation-not-allowed|invalid-api-key|api-key-not-valid|network/.test(e.code||''))throw e}
  try{localStorage.setItem('lms_fb',JSON.stringify(c))}catch(e){}firebaseConfig=c;S.msg='';render()}
 catch(e){db=null;S.msg='Could not connect: '+(e.code||'')+' '+(e.message||e)+' — check the values and that Authentication → Email/Password is enabled.';render()}}
async function signup(){const n=($('#n').value||'').trim(),u=$('#u').value.trim().toLowerCase().replace(/[^a-z0-9_.@+-]/g,''),p=$('#p').value,role=$('#role').value;
 if(!n||u.length<3||p.length<6)return amsg('Enter your name, a username or email (3+ chars) and a password (6+ chars)');if(p!==$('#p2').value)return amsg('Passwords do not match');
 let created=false;
 try{const uid=(await auth.createUserWithEmailAndPassword(u.includes('@')?u:u+DOM,p)).user.uid;created=true;
  await db.doc('users/'+uid).set({username:u,name:n,role});enter({id:uid,role,name:n,username:u})}
 catch(e){if(created){try{await auth.currentUser.delete()}catch(x){}}amsg(aerr(e))}}


async function login(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
 try{const uid=(await auth.signInWithEmailAndPassword(u.includes('@')?u:(u||'x')+DOM,p)).user.uid;await loadProfile(uid);if(!S.user)amsg('Profile not found')}catch(e){amsg(aerr(e))}}
function enter(u){S.user=u;S.msg='';S.tab=u.role=='teacher'?'exams':'ebooks';sub();render()}
let U=[];const unsub=()=>{U.forEach(f=>f());U=[]};
function sub(){unsub();const T=S.user.role=='teacher',me=S.user.id,c=(n,k,q)=>U.push((q||db.collection(n)).onSnapshot(x=>{S[k]=x.docs.map(d=>({id:d.id,...d.data()}));if(k=='keysL'){S.keys={};x.docs.forEach(d=>S.keys[d.id]=d.data())}if(!S.taking)render()},e=>console.error(e)));
 c('materials','mats');c('exams','exams');c('syllabus','syl');
 if(T){c('progress','prog');c('submissions','subs');c('users','users');c('examKeys','keysL')}else{U.push(db.doc('users/'+me).onSnapshot(d=>{const x=d.data();if(x){Object.assign(S.user,{name:x.name,phone:x.phone,email:x.email,batch:x.batch,joined:x.joined,notes:x.notes});if(!S.taking)render()}}));c('progress','prog',db.collection('progress').where('uid','==',me));c('sent','sent',db.collection('sent').where('uid','==',me));c('results','results',db.collection('results').where('uid','==',me))}}
function logout(){unsub();S.mode='login';S.user=null;S.taking=null;S.open=null;S.subs=[];S.users=[];S.syl=[];S.prog=[];S.pstu=null;S.editStu=null;S.pf='all';S.sent=[];S.results=[];auth.signOut();render()}
function stuView(){const st=S.users.filter(u=>u.role=='student'),ed=S.editStu&&st.find(u=>u.id==S.editStu),f=(k,l,t)=>`<div><span class="mu">${l}</span><input id="sd_${k}" type="${t||'text'}" value="${esc(ed[k])}"></div>`;
 return`${ed?`<div class="card"><b>Student details – ${esc(ed.name)}</b><div class="det">${f('phone','Phone','tel')}${f('email','Email','email')}${f('batch','Batch / Class')}${f('joined','Joining date','date')}</div><span class="mu">Notes</span><textarea id="sd_notes" rows="2">${esc(ed.notes)}</textarea><p><button onclick="saveStu('${ed.id}')">Save details</button> <button class="g" onclick="S.editStu=null;render()">Cancel</button> <span class="er" id="sdm"></span></p></div>`:''}
 <div class="card"><b>Upload student details</b><p class="mu">Upload an Excel/CSV with columns: <code>Username</code> (or <code>Name</code>), Phone, Email, Batch, Joined, Notes. Details are matched to students who have signed up.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="upStu(this)"><span class="mu" id="ust"></span></div>
 <div class="card"><div class="row" style="justify-content:space-between"><b>Students</b><button onclick="openStu()">＋ Add student</button></div><p class="mu">Add a student with “Add student”, or students can create their own accounts using “Sign up”. Click “Details” to edit phone, batch etc.</p><div style="overflow-x:auto"><table><tr><th>Name</th><th>Username</th><th>Phone</th><th>Batch</th><th>Course progress</th><th></th></tr>${st.map(u=>{const c=counts(u.id);return`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.phone)||'<span class="mu">–</span>'}</td><td>${esc(u.batch)||'<span class="mu">–</span>'}</td><td>${c.p}%</td><td><a href="#" onclick="S.editStu='${u.id}';render();return false">Details</a> · <a href="#" onclick="S.tab='progress';S.pstu='${u.id}';render();return false">Progress</a> · <a href="#" class="er" onclick="delDoc('users','${u.id}');return false">Remove</a></td></tr>`}).join('')}</table></div></div>`}
function openStu(){if($('#stuModal'))return;const d=document.createElement('div');d.id='stuModal';d.className='modal';
 const f=(k,l,t,ph)=>`<div><span>${l}</span><input id="ns_${k}" type="${t||'text'}" placeholder="${ph||''}" autocomplete="off" autocapitalize="none"></div>`;
 d.innerHTML=`<div class="box"><h3>Add student</h3><p class="mu">Creates the student's login. They will see E-books, Videos, Exams &amp; Results and their course progress.</p>
 <b class="mu">Login details</b><div class="det">${f('name','Full name *','text','Full name')}${f('user','Username or email * (3+ chars)','text','Username or email')}${f('pw','Password * (6+ chars)','text','Password')}${f('pw2','Confirm password *','text','Confirm password')}</div>
 <b class="mu" style="display:block;margin-top:12px">Student details (optional)</b><div class="det">${f('phone','Phone','tel')}${f('email','Email','email')}${f('batch','Batch / Class')}${f('joined','Joining date','date')}</div>
 <span class="mu" style="display:block;margin-top:6px;font-size:12px">Notes</span><textarea id="ns_notes" rows="2"></textarea>
 <p class="er" id="nsm"></p><div class="row" style="justify-content:flex-end"><button class="g" onclick="closeStu()">Cancel</button><button id="nsb" onclick="addStudent()">Add student</button></div></div>`;
 d.addEventListener('mousedown',e=>{if(e.target===d)closeStu()});document.body.appendChild(d);$('#ns_name').focus()}
const closeStu=()=>{const m=$('#stuModal');if(m)m.remove()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeStu()});
async function addStudent(){const g=k=>$('#ns_'+k).value.trim(),n=g('name'),u=g('user').toLowerCase().replace(/[^a-z0-9_.@+-]/g,''),p=$('#ns_pw').value,m=$('#nsm'),btn=$('#nsb');
 if(!n||u.length<3||p.length<6)return m.textContent='Enter name, a username/email (3+ chars) and a password (6+ chars)';
 if(p!==$('#ns_pw2').value)return m.textContent='Passwords do not match';
 if(S.users.some(x=>x.username==u))return m.textContent='Username already taken';
 btn.disabled=true;m.textContent='Creating…';let app,uid;
 try{/* separate Firebase app so the teacher stays logged in */
  app=firebase.initializeApp(firebaseConfig,'stu'+Date.now());const a2=app.auth();
  uid=(await a2.createUserWithEmailAndPassword(u.includes('@')?u:u+DOM,p)).user.uid;
  try{await app.firestore().doc('users/'+uid).set({username:u,name:n,role:'student'})}catch(e){try{await a2.currentUser.delete()}catch(x){}throw e}
  await a2.signOut()}
 catch(e){m.textContent=aerr(e);btn.disabled=false;if(app)try{await app.delete()}catch(x){}return}
 try{await app.delete()}catch(x){}
 const d={};['phone','email','batch','joined','notes'].forEach(k=>{if(g(k))d[k]=g(k)});
 if(Object.keys(d).length)try{await db.doc('users/'+uid).update(d)}catch(e){alert('Student created, but extra details could not be saved ('+(e.message||e.code)+'). Use “Details” to add them.')}
 closeStu()}
async function upStu(inp){const f=inp.files[0];if(!f)return;const st=$('#ust');st.textContent='Reading…';
 try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),stus=S.users.filter(u=>u.role=='student'),b=db.batch();let ok=0;const miss=[];
  rows.forEach(r=>{const g={};for(const k in r)g[k.trim().toLowerCase()]=String(r[k]).trim();const un=(g.username||'').toLowerCase(),nm=(g.name||'').toLowerCase(),u=stus.find(x=>un&&x.username==un)||stus.find(x=>nm&&x.name.toLowerCase()==nm);
   if(!u){miss.push(g.username||g.name||'(blank)');return}const d={};['phone','email','batch','joined','notes'].forEach(k=>{if(g[k])d[k]=g[k]});if(Object.keys(d).length){b.update(db.doc('users/'+u.id),d);ok++}});
  await b.commit();st.textContent=ok+' student(s) updated.'+(miss.length?' Not found: '+miss.join(', '):'')}catch(e){st.textContent='Error: '+(e.message||e.code||e)}inp.value=''}
async function saveStu(id){const g=k=>$('#sd_'+k).value.trim();try{await db.doc('users/'+id).update({phone:g('phone'),email:g('email'),batch:g('batch'),joined:g('joined'),notes:g('notes')});S.editStu=null;render()}catch(e){$('#sdm').textContent='Could not save: '+(e.message||e.code)}}
/* ---------- syllabus & course progress ---------- */
const sylList=()=>S.syl.slice().sort((a,b)=>a.ts-b.ts);
const progOf=u=>((S.prog.find(p=>p.id==u)||{}).done)||{};
function walk(list,fn){(list||[]).forEach(n=>{fn(n);walk(n.subs,fn)})}
function counts(u,tp){const d=progOf(u);let t=0,n=0;walk(tp?tp.subs:sylList().flatMap(x=>x.subs||[]),x=>{t++;if(d[x.id])n++;(x.sw||[]).forEach(w=>{t++;if(d[x.id+'_'+w.id])n++})});return{t,n,p:t?Math.round(n*100/t):0}}
const tk=(on,key,u,ed)=>`<span class="tk ${on?'on':''} ${ed?'ed':''}" ${ed?`onclick="togProg('${u}','${key}')" title="Click to mark / unmark"`:''}>${on?'✓':''}</span>`;
async function togProg(u,key){const d={...progOf(u)};if(d[key])delete d[key];else d[key]=true;try{await db.doc('progress/'+u).set({uid:u,done:d})}catch(e){alert('Could not save: '+(e.message||e.code))}}
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const want=(on,f)=>f=='all'||!!on==(f=='done');
function vis(n,dn,f){return want(dn[n.id],f)||(n.sw||[]).some(w=>want(dn[n.id+'_'+w.id],f))||(n.subs||[]).some(x=>vis(x,dn,f))}
function detCard(o){const r=(l,v)=>`<div><span>${l}</span>${esc(v)||'–'}</div>`;return`<div class="card"><b>${esc(o.name)}</b> <span class="mu">@${esc(o.username)}</span><div class="det" style="margin-top:8px">${r('Phone',o.phone)}${r('Email',o.email)}${r('Batch / Class',o.batch)}${r('Joined',o.joined)}</div>${o.notes?`<p class="mu">${esc(o.notes)}</p>`:''}</div>`}
function progNode(n,o,T,dn,f,d){if(!vis(n,dn,f))return'';
 return`<div style="margin-left:${d?20:0}px"><div class="sr">${tk(dn[n.id],n.id,o.id,T)}<span style="flex:1 1 auto"><b>${esc(n.name)}</b></span></div>${(n.sw||[]).filter(w=>want(dn[n.id+'_'+w.id],f)).map(w=>`<div class="sw">${tk(dn[n.id+'_'+w.id],n.id+'_'+w.id,o.id,T)}<span style="color:var(--tx)">🛠 ${esc(w.name)}</span></div>`).join('')}${(n.subs||[]).map(x=>progNode(x,o,T,dn,f,d+1)).join('')}</div>`}
function progBody(o,T){const L=sylList(),c=counts(o.id),d=progOf(o.id),f=S.pf,fb=(k,l)=>`<button class="${f==k?'':'g'}" onclick="S.pf='${k}';render()">${l}</button>`;
 return`${detCard(o)}<div class="card"><b>Overall progress</b> <span class="mu">${c.p}%</span>${bar(c.p)}<p style="margin:10px 0 0"><span class="ok"><b>✓ Covered: ${c.n}</b></span> &nbsp; <span class="mu"><b>○ Pending: ${c.t-c.n}</b></span></p></div>
 <div class="row" style="margin-bottom:12px">${fb('all','All')}${fb('done','Covered')}${fb('pending','Pending')}</div>
 ${L.map(t=>{const tc=counts(o.id,t),body=(t.subs||[]).map(x=>progNode(x,o,T,d,f,0)).join('');if(f!='all'&&!body)return'';return`<div class="card"><div class="row"><b style="flex:1 1 auto">${esc(t.name)}</b><span class="mu" style="flex:0 0 auto">${tc.n}/${tc.t} · ${tc.p}%</span></div>${bar(tc.p)}${body||'<p class="mu">No sub topics added yet.</p>'}</div>`}).join('')||'<p class="mu">The teacher has not created a syllabus yet.</p>'}`}
function progView(T){
 if(!T)return progBody(S.user,false);
 const st=S.users.filter(u=>u.role=='student'),cur=st.find(u=>u.id==S.pstu);
 return`<div class="grid"><div><p class="mu">Select a student</p>${st.map(u=>`<div class="item ${cur&&cur.id==u.id?'on':''}" onclick="S.pstu='${u.id}';render()">${esc(u.name)} <span class="tag">${counts(u.id).p}%</span></div>`).join('')||'<p class="mu">No students have signed up yet.</p>'}</div>
 <div>${cur?`<p class="mu">Tap a box to mark it complete (green ✓). Tap again to clear.</p>${progBody(cur,true)}`:'<div class="card"><p class="mu">Select a student to see and update their course progress.</p></div>'}</div></div>`}
function sylNode(tid,n,d){return`<div class="item" style="cursor:default;${d?'margin:8px 0 0 14px':''}"><div class="row"><span style="flex:1 1 auto">${d?'↳':'📄'} <b>${esc(n.name)}</b></span><a href="#" style="flex:0 0 auto" onclick="renNode('${tid}','${n.id}');return false">rename</a><a href="#" class="er" style="flex:0 0 auto" onclick="delSub('${tid}','${n.id}');return false">remove</a></div>
 <div style="margin:4px 0">${(n.sw||[]).map(w=>`<span class="tag">🛠 ${esc(w.name)} <a href="#" class="er" onclick="delSw('${tid}','${n.id}','${w.id}');return false">✕</a></span> `).join('')||'<span class="mu">No software added</span>'}</div>

function parseText(t){const qs=[];let c=null,m;t.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
 if(m=l.match(/^(?:Q\.?\s*)?(\d+)[.)]\s*(.+)/i)){c={q:m[2],opts:[],ans:'',marks:1};qs.push(c)}
 else if(c&&(m=l.match(/^\(?([A-D])[.)]\s*(.+)/i)))c.opts.push(m[2]);
 else if(c&&(m=l.match(/^(?:ans(?:wer)?|correct)\s*[:\-]\s*(.+)/i)))c.ans=m[1].trim();
 else if(c&&(m=l.match(/^marks?\s*[:\-]\s*(\d+)/i)))c.marks=+m[1];else if(c)c.q+=' '+l});
 return qs.map(q=>{let m=q.q.match(/[\[(]\s*(\d+)\s*marks?\s*[\])]/i);if(m){q.marks=+m[1];q.q=q.q.replace(m[0],'').trim()}
  const mc=q.opts.length>1;return{q:q.q,type:mc?'mcq':'para',opts:mc?q.opts:[],ai:mc?'ABCD'.indexOf(q.ans.charAt(0).toUpperCase()):-1,marks:q.marks}})}
async function readFile(f){const n=f.name.toLowerCase(),buf=await f.arrayBuffer();
 if(/\.xlsx?$/.test(n)||n.endsWith('.csv')){const wb=XLSX.read(buf),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  return rows.map(r=>{const g={};for(const k in r)g[k.trim().toLowerCase()]=String(r[k]).trim();
   const opts=['a','b','c','d','e'].map(x=>g['option '+x]||g[x]||g['option'+x]||'').filter(Boolean),q=g.question||g.q||'';
   const mc=opts.length>1&&!/para/i.test(g.type||''),an=(g.answer||g.correct||'').toUpperCase();
   let ai=mc?'ABCDE'.indexOf(an.charAt(0)):-1;if(mc&&ai>=0&&an.length>1){const j=opts.findIndex(o=>o.toUpperCase()==an);if(j>=0)ai=j}
   return{q,type:mc?'mcq':'para',opts:mc?opts:[],ai,marks:+(g.marks||g.mark)||1}}).filter(q=>q.q)}
 if(n.endsWith('.docx'))return parseText((await mammoth.extractRawText({arrayBuffer:buf})).value);
 if(n.endsWith('.pdf')){const pdf=await pdfjsLib.getDocument({data:buf}).promise;let t='';
  for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();let y=null;c.items.forEach(it=>{const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>3)t+='\n';t+=it.str+' ';y=yy});t+='\n'}
  return parseText(t)}
 throw Error('Use .docx, .xlsx or .pdf')}
